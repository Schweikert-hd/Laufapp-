<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7efe2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mein Weg">
<title>Mein Weg zum Atos-Halbmarathon</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%83%3C/text%3E%3C/svg%3E">
<style>:root{ --bg:#f7efe2; --card:#fffaf1; --ink:#2b1d17; --muted:#7a6656; --wine:#8e2433; --wine2:#6e1a27; --sand:#c8735a; --gold:#c9962e; --purple:#7b3f8c; --sky:#5f9fd6; --green:#4f8a43; --line:#ead9c2; --dark:#2a1a14;
  --r:18px; --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --head:'Fraunces',Georgia,serif; --title:none; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body{ margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 var(--font); }
body{ background-image:radial-gradient(ellipse at top, #fff6e6 0%, var(--bg) 55%); background-attachment:fixed; }
body.noscroll{ overflow:hidden; }
#app{ max-width:720px; margin:0 auto; padding:0 16px calc(92px + env(safe-area-inset-bottom)); min-height:100vh; }
h1,h2,h3,h4{ font-family:var(--head); font-weight:700; line-height:1.15; margin:.2em 0 .5em; letter-spacing:-.01em; color:var(--wine2); }
h1{ font-size:2.2rem; } h2{ font-size:1.5rem; } h3{ font-size:1.15rem; } h4{ font-size:1rem; margin-bottom:.3em; }
p{ margin:.4em 0; } a{ color:var(--wine); }
.muted{ color:var(--muted); } .small{ font-size:.86rem; } .mt{ margin-top:1.3em; }
.src{ color:var(--muted); font-size:.78rem; font-style:italic; }
.kicker{ text-transform:uppercase; letter-spacing:.12em; font-size:.68rem; font-weight:700; color:var(--sand); }
.kicker.light{ color:#ffd9a6; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:16px; margin:14px 0; box-shadow:0 2px 0 rgba(120,80,40,.06); }
.card.note{ background:#fff3dc; border-color:#f0d9a8; }
.row{ display:flex; gap:10px; align-items:center; margin-top:10px; } .row.wrap{ flex-wrap:wrap; }
.btn{ appearance:none; border:none; background:linear-gradient(180deg,#9c2a3a,var(--wine2)); color:#fff8ef; font:600 .95rem var(--font); padding:11px 16px; border-radius:12px; cursor:pointer; box-shadow:0 2px 0 rgba(70,15,25,.35); }
.btn:active{ transform:translateY(1px); box-shadow:none; } .btn.big{ width:100%; padding:14px; font-size:1.05rem; margin-top:10px; }
.btn.ghost{ background:transparent; color:var(--wine); border:1.5px solid #dcc1a7; box-shadow:none; } .btn.sm{ padding:7px 12px; font-size:.85rem; }
.btn.danger{ background:#a3261e; } .btn:disabled{ opacity:.45; }
label{ display:block; font-weight:600; font-size:.9rem; margin:14px 0 4px; }
input,select,textarea{ width:100%; font:16px var(--font); padding:11px 12px; border:1.5px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); margin-top:6px; }
input:focus,select:focus{ outline:none; border-color:var(--sand); box-shadow:0 0 0 3px rgba(200,115,90,.18); }
input.inl{ width:90px; display:inline-block; margin:0 0 0 6px; padding:5px 8px; }
label small{ display:block; font-weight:400; color:var(--muted); margin-top:5px; }
label.radio{ display:flex; gap:10px; align-items:flex-start; font-weight:500; margin:9px 0; } label.radio>input[type=radio], label.radio>input[type=checkbox]{ width:auto; margin-top:3px; }
fieldset{ border:none; padding:0; margin:16px 0 0; } legend{ font-weight:700; font-size:.9rem; }
hr{ border:none; border-top:1px solid var(--line); margin:16px 0; }
.err{ color:#a3261e; font-weight:600; min-height:1em; }
.unit{ display:flex; align-items:center; gap:8px; } .unit input{ flex:1; } .unit span{ color:var(--muted); font-weight:500; white-space:nowrap; }
.unit.sub{ margin:0 0 6px 28px; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:0 12px; } .grid2 label{ margin-top:8px; }
.loading{ padding:40vh 0; text-align:center; color:var(--muted); }
/* Login */
.auth{ padding-top:env(safe-area-inset-top); }
.hero-art{ margin:0 -16px 10px; position:relative; text-align:center; }
.hero-art img{ display:block; width:100%; max-width:min(100%, 50vh); margin:0 auto; aspect-ratio:1/1; height:auto; object-fit:contain; border-radius:0 0 18px 18px; }
.hero-art::after{ display:none; }
.apptitle{ position:relative; margin:4px 0 10px; text-align:center; font-size:1.6rem; font-style:italic; color:var(--wine2); }
.auth{ max-width:520px; margin:0 auto; }
.auth .seg{ margin:6px 0 10px; } .auth .seg button{ padding:7px; }
.auth .card{ padding:12px 14px; margin:8px 0 16px; } .auth label{ margin:8px 0 2px; font-size:.85rem; } .auth input{ padding:9px 11px; margin-top:4px; } .auth .btn.big{ padding:11px; margin-top:6px; } .auth .err{ min-height:0; margin:4px 0; }
.seg{ display:flex; background:#efe2cf; border-radius:14px; padding:4px; gap:4px; margin:10px 0; }
.seg button{ flex:1; border:none; background:transparent; padding:9px; border-radius:11px; font:600 .92rem var(--font); color:var(--muted); cursor:pointer; }
.seg button.on{ background:var(--card); color:var(--wine); box-shadow:0 1px 3px rgba(80,40,20,.15); }
.pw{ display:flex; gap:8px; align-items:center; } .pw input{ flex:1; font-family:ui-monospace,Menlo,monospace; letter-spacing:.04em; }
.pwt{ margin-top:6px; border:1.5px solid var(--line); background:#fff; border-radius:12px; padding:10px; font:600 .8rem var(--font); color:var(--muted); cursor:pointer; }
.setup-h{ padding:28px 2px 0; }
/* Header & Tabs */
.top{ display:flex; justify-content:space-between; align-items:center; padding:calc(14px + env(safe-area-inset-top)) 0 4px; }
.hello{ font-family:var(--head); font-size:1.35rem; font-weight:700; color:var(--wine2); }
.badge{ font:700 .65rem var(--font); background:var(--purple); color:#fff; border-radius:8px; padding:2px 7px; vertical-align:middle; letter-spacing:.05em; }
.testbar{ background:var(--purple); color:#fff; border-radius:12px; padding:6px 12px; font-size:.82rem; margin:6px 0; }
.icon{ background:var(--card); border:1px solid var(--line); border-radius:12px; width:42px; height:42px; font-size:1.1rem; cursor:pointer; }
.tabs{ position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; background:rgba(255,250,241,.95); backdrop-filter:blur(10px); border-top:1px solid var(--line); padding:6px 4px calc(6px + env(safe-area-inset-bottom)); z-index:20; }
.tabs button{ flex:1; max-width:120px; background:none; border:none; font:600 .66rem var(--font); color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:1px; padding:4px 2px; cursor:pointer; border-radius:10px; }
.tabs button span{ font-size:1.2rem; } .tabs button.on{ color:var(--wine); background:#f6e2d6; }
/* Countdown */
.countdown{ display:flex; gap:18px; align-items:center; color:#fff6ea; border:none; background:linear-gradient(110deg, rgba(42,22,14,.88) 15%, rgba(42,22,14,.55)), var(--title) center 60%/cover; }
.countdown h2{ color:#fff; }
.ring{ --p:0; flex:0 0 104px; height:104px; border-radius:50%; background:conic-gradient(var(--gold) calc(var(--p)*1%), rgba(255,255,255,.18) 0); display:grid; place-items:center; }
.ring>div{ width:84px; height:84px; border-radius:50%; background:rgba(42,22,14,.92); display:flex; flex-direction:column; align-items:center; justify-content:center; }
.ring b{ font-family:var(--head); font-size:1.8rem; line-height:1; } .ring span{ font-size:.72rem; opacity:.85; }
.cd-txt h2{ margin:.15em 0 .1em; font-size:1.3rem; } .cd-txt p{ margin:0; opacity:.9; font-size:.9rem; }
.stats{ display:flex; gap:14px; margin-top:10px; flex-wrap:wrap; } .stats div{ display:flex; flex-direction:column; } .stats b{ font-size:1.08rem; } .stats span{ font-size:.68rem; opacity:.8; }
@media (max-width:440px){ .countdown{ flex-direction:column; align-items:flex-start; } }
.sec-h{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:16px; } .sec-h h2,.sec-h h3{ margin:0; }
/* Einheiten */
.sessions{ display:flex; flex-direction:column; gap:8px; margin:8px 0; }
.sess{ display:flex; gap:12px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; }
.sess.today{ border-color:var(--sand); box-shadow:0 0 0 2px #f3d2c3; } .sess.race{ background:#fff0d4; border-color:var(--gold); }
.sess.done{ background:#f0f6e8; border-color:#cfe2bd; } .sess.skipped{ opacity:.5; } .sess.skipped .sl{ text-decoration:line-through; }
.chk{ flex:0 0 32px; height:32px; border-radius:50%; border:2px solid #d4bfa6; background:#fff; color:#fff; font-weight:800; cursor:pointer; }
.sess.done .chk{ background:var(--green); border-color:var(--green); }
.sx{ flex:1; min-width:0; } .sd{ font-size:.75rem; color:var(--muted); } .sl{ font-weight:650; } .sm{ font-size:.8rem; color:var(--muted); } .sm a{ color:var(--wine); text-decoration:none; font-weight:600; } .sm.warn{ color:#a3561e; }
.logsum{ font-size:.82rem; margin-top:6px; color:var(--green); font-weight:600; } .logsum a{ font-weight:500; margin-left:6px; }
.skip{ background:none; border:none; color:#c3ad95; font-size:1rem; cursor:pointer; padding:4px; }
.block-h{ margin:22px 0 6px; } .block-h h3{ margin:0; }
details.week{ background:var(--card); border:1px solid var(--line); border-radius:14px; margin:6px 0; padding:0 12px; }
details.week.cur{ border-color:var(--sand); } details.week.reentry{ border-left:4px solid var(--gold); }
details.week summary{ list-style:none; display:flex; gap:10px; align-items:center; padding:12px 0; cursor:pointer; font-size:.9rem; }
details.week summary::-webkit-details-marker{ display:none; }
.wn{ font-weight:800; color:var(--wine); width:34px; } .wd{ color:var(--muted); width:46px; } .wt{ flex:1; } .wk{ color:var(--muted); } .wdn{ background:#efe2cf; border-radius:10px; padding:1px 8px; font-size:.78rem; }
/* Teaser & Karten */
.game-teaser{ display:flex; gap:14px; align-items:center; cursor:pointer; background:linear-gradient(135deg,#5b2d6b,var(--purple)); color:#fff; border:none; }
.game-teaser p{ opacity:.9; font-size:.88rem; } .gt-ic{ font-size:2rem; }
.bar{ height:8px; background:rgba(255,255,255,.25); border-radius:8px; overflow:hidden; margin-top:6px; } .bar i{ display:block; height:100%; background:var(--gold); }
.boss-banner{ background:linear-gradient(135deg,#ead3f0,#f6e0b8); cursor:pointer; border:none; }
.advent-teaser{ background:linear-gradient(135deg,#2e5a3f,#3f7a56); color:#fff; border:none; cursor:pointer; }
.quote{ background:#f8e7dc; border-color:#efd2c2; } .quote p{ font-family:var(--head); font-size:1.18rem; font-style:italic; color:var(--wine2); }
.fact{ border-left:5px solid var(--sky); } .fact h3{ margin:.2em 0 .2em; }
.quote-inline{ font-style:italic; margin-top:12px; }
.devnote{ background:#f1e6f5; border:1px dashed var(--purple); color:#4f2a5c; border-radius:10px; padding:8px 10px; font-size:.84rem; }
/* Sheet */
.sheet{ position:fixed; inset:0; background:rgba(42,26,20,.45); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
.sheet .sbody{ background:var(--card); width:100%; max-width:560px; max-height:88vh; overflow:auto; border-radius:22px 22px 0 0; padding:20px 18px calc(22px + env(safe-area-inset-bottom)); }
@media (min-width:700px){ .sheet{ align-items:center; } .sheet .sbody{ border-radius:22px; } }
.hidden{ display:none !important; }
#toast,#gToast{ position:fixed; left:50%; bottom:96px; transform:translate(-50%,20px); background:var(--dark); color:#fff; padding:10px 16px; border-radius:14px; opacity:0; transition:.3s; z-index:80; max-width:88vw; text-align:center; font-size:.9rem; pointer-events:none; }
#toast.show,#gToast.show{ opacity:1; transform:translate(-50%,0); } #gToast{ bottom:auto; top:60px; }
/* Spiel-Tab */
.lang{ flex-shrink:0; display:flex; border:1.5px solid var(--line); border-radius:12px; overflow:hidden; } .lang button{ border:none; background:#fff; padding:6px 12px; font-weight:700; cursor:pointer; color:var(--muted); } .lang button.on{ background:var(--purple); color:#fff; }
.story{ background:linear-gradient(160deg,#fff8ec,#f3dfc6); }
.gear{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; } .gi{ text-align:center; padding:8px 4px; border-radius:12px; background:#efe5d6; filter:grayscale(1); opacity:.45; }
.gi span{ font-size:1.6rem; display:block; } .gi small{ font-size:.68rem; } .gi.got{ filter:none; opacity:1; background:#fff0d4; }
.levels{ display:flex; flex-direction:column; gap:8px; margin:10px 0; }
.lvl{ display:flex; align-items:center; gap:12px; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:10px 12px; cursor:pointer; font:inherit; color:inherit; }
.lvl .ln{ flex:0 0 40px; height:40px; border-radius:12px; display:grid; place-items:center; background:var(--sand); color:#fff; font-weight:800; font-size:1.1rem; }
.lvl .lt{ flex:1; display:flex; flex-direction:column; } .lvl .lt small{ color:var(--muted); } .lvl .lg{ font-size:1.4rem; }
.lvl.locked{ opacity:.6; } .lvl.locked .ln{ background:#a8998a; } .lvl.done .ln{ background:var(--green); }
.lvl.boss .ln{ background:var(--purple); } .lvl.xmas .ln{ background:#2e7d4f; } .lvl.nye .ln{ background:#3c3a8e; }
.advent{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.door{ aspect-ratio:1; border:none; border-radius:14px; background:linear-gradient(145deg,#3f7a56,#2a573c); color:#fff; font:700 1.1rem var(--head); display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; box-shadow:inset 0 0 0 2px rgba(255,255,255,.14); }
.door:nth-child(3n){ background:linear-gradient(145deg,#a33445,var(--wine2)); } .door:nth-child(4n+1){ background:linear-gradient(145deg,#8a55a0,#5b2d6b); }
.door.big{ background:linear-gradient(145deg,#d9a640,#a87a1c); }
.door .di{ font-size:.95rem; } .door.seen{ opacity:.78; } .door:not(.open){ filter:saturate(.6); }
/* Rangliste */
.rank{ list-style:none; padding:0; margin:0; } .rank li{ display:flex; align-items:center; gap:12px; padding:10px 4px; border-bottom:1px solid var(--line); }
.rank li:last-child{ border-bottom:none; } .rank li.me{ background:#fff0d4; border-radius:10px; } .rank .pos{ width:34px; text-align:center; font-weight:800; font-size:1.05rem; color:var(--wine); }
.rank .nm{ flex:1; font-weight:600; } .rank .val{ font-weight:700; color:var(--wine2); }
/* Overlays */
.gov{ position:fixed; inset:0; background:#1d140f; z-index:60; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); touch-action:none; }
.gwrap{ position:relative; width:100%; max-width:1000px; display:flex; flex-direction:column; align-items:center; }
#gc{ display:block; border-radius:10px; background:#000; }
#gclose,#gMute{ position:absolute; top:-6px; right:8px; z-index:9; background:rgba(255,255,255,.15); color:#fff; border:none; width:38px; height:38px; border-radius:50%; font-size:1.05rem; cursor:pointer; }
#gMute{ right:54px; }
.gtouch{ display:flex; justify-content:space-between; width:100%; max-width:760px; padding:14px 14px 4px; gap:12px; user-select:none; -webkit-user-select:none; }
.gtouch .grp{ display:flex; gap:12px; } .gtouch button{ width:72px; height:64px; border-radius:18px; border:none; background:rgba(255,255,255,.14); color:#fff; font-size:1.6rem; touch-action:none; }
.gtouch button.on{ background:rgba(255,255,255,.35); } #gJ{ width:96px; background:rgba(201,150,46,.5); }
#gBossBtns{ gap:10px; justify-content:center; padding-top:6px; } #gBossBtns button{ background:rgba(255,255,255,.14); color:#fff; border:none; border-radius:14px; padding:10px 14px; font:600 .9rem var(--font); }
.gpanel{ position:fixed; inset:0; z-index:8; display:flex; flex-direction:column; justify-content:center; background:rgba(29,20,15,.96); color:#f7ecdc; padding:calc(64px + env(safe-area-inset-top)) max(22px, calc(50vw - 300px)) 24px; overflow:auto; line-height:1.5; }
.gpanel h3{ color:#fff; } .gpanel .kicker{ color:var(--gold); } .gpanel .src{ color:#cbbba6; } .gpanel .muted{ color:#c5b39d; }
.gpanel .btn.ghost{ color:#fff; border-color:rgba(255,255,255,.4); } .gpanel .btn{ align-self:flex-start; }
.gearlist{ padding-left:18px; margin:6px 0 12px; font-size:.88rem; }
.ffbox{ background:rgba(255,255,255,.08); border-radius:12px; padding:10px 12px; margin:10px 0; } .ffbox.light{ background:#f3ead9; }
.itembox{ display:flex; gap:12px; align-items:center; background:rgba(201,150,46,.2); border-radius:12px; padding:10px; margin:8px 0; } .itembox>span{ font-size:2rem; }
.rotate-hint{ display:none; color:#cbbba6; font-size:.8rem; text-align:center; padding:8px; }
@media (orientation:portrait){ .rotate-hint{ display:block; } }
@media (max-height:520px){ .gtouch{ position:absolute; bottom:0; padding:6px; pointer-events:none; } .gtouch .grp, #gBossBtns{ pointer-events:auto; } .gtouch button{ background:rgba(255,255,255,.2); } }
/* Minispiele */
.mg{ position:fixed; inset:0; background:rgba(29,20,15,.7); z-index:70; display:flex; align-items:center; justify-content:center; padding:14px; }
.mgbody{ background:var(--card); border-radius:20px; padding:18px; max-width:420px; width:100%; max-height:92vh; overflow:auto; text-align:center; }
.mgbody p.big{ font-size:1.1rem; } .doorhead{ font:700 .75rem var(--font); text-transform:uppercase; letter-spacing:.1em; color:var(--sand); }
.mgcv{ width:100%; max-width:300px; border-radius:12px; background:#eef4fa; touch-action:none; }
.rx{ height:150px; border-radius:16px; background:var(--sky); color:#fff; display:grid; place-items:center; font:700 1.5rem var(--head); margin:12px 0; cursor:pointer; user-select:none; touch-action:manipulation; }
.rx.wait{ background:#a87a1c; } .rx.go{ background:var(--green); } .rx.bad{ background:#a3261e; }
.mem{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:12px 0; }
.mem .card{ margin:0; aspect-ratio:1; padding:0; display:grid; place-items:center; font-size:1.7rem; cursor:pointer; background:var(--purple); border:none; border-radius:12px; }
.mem .card span{ visibility:hidden; } .mem .card.up{ background:#fff; border:1px solid var(--line); } .mem .card.up span{ visibility:visible; } .mem .card.ok{ background:#e6f2dc; }
.qo{ display:flex; flex-direction:column; gap:8px; margin:12px 0; } .q.right{ background:#e6f2dc; border-color:var(--green); color:var(--ink); } .q.wrong{ background:#fde2df; border-color:#a3261e; }
.mgbody .row{ justify-content:center; } .mgbody .btn{ margin-top:8px; }
/* Tabellen, Wissen, Literatur */
.tbl{ width:100%; border-collapse:collapse; margin:10px 0; font-size:.9rem; } .tbl td{ padding:7px 4px; border-bottom:1px solid var(--line); } .tbl tr.hl td{ background:#fff0d4; }
details.gl{ border-bottom:1px solid var(--line); padding:9px 0; } details.gl summary{ cursor:pointer; } details.gl p{ font-size:.92rem; }
details.factcat{ background:var(--card); border:1px solid var(--line); border-radius:16px; margin:10px 0; padding:0 14px; }
details.factcat summary{ list-style:none; display:flex; gap:12px; align-items:center; padding:12px 0; cursor:pointer; } details.factcat summary::-webkit-details-marker{ display:none; }
.fci{ font-size:1.6rem; flex:0 0 44px; height:44px; display:grid; place-items:center; background:#f3e4cf; border-radius:12px; }
details.factcat summary span:last-child{ display:flex; flex-direction:column; } details.factcat summary small{ color:var(--muted); font-size:.8rem; }
.factitem{ border-top:1px solid var(--line); padding:12px 0; } .factitem h4{ color:var(--wine); } .factitem p{ margin:.2em 0 .3em; }
.apa{ padding-left:2em; text-indent:-2em; font-size:1rem; }
#gS{ background:rgba(217,166,64,.35); font-size:1.4rem; }
body::before{ content:''; position:fixed; left:0; right:0; bottom:0; height:200px; background:var(--skyline) repeat-x left bottom / 640px 200px; opacity:.09; pointer-events:none; z-index:0; }
#app{ position:relative; z-index:1; }
.warnbox{ background:#fff3dc; border:1px solid #f0d9a8; border-radius:10px; padding:8px 10px; font-size:.86rem; }
.days .dnrow{ gap:18px; justify-content:flex-start; margin:4px 0 6px; } .days .dnrow .radio{ margin:0; }
.days label small{ font-weight:400; color:var(--muted); }
.days .dwarn p{ margin:6px 0 0; }
.sec-h .row{ gap:6px; }
/* Rubrik Krafttraining */
.chips{ display:flex; gap:6px; overflow-x:auto; padding:2px 0 10px; margin:0 -2px; scrollbar-width:none; } .chips::-webkit-scrollbar{ display:none; }
.chips button{ flex:none; border:1.5px solid var(--line); background:var(--card); color:var(--wine); font:600 .82rem var(--font); padding:7px 11px; border-radius:999px; cursor:pointer; }
[id^=k-]{ scroll-margin-top:12px; }
.kbasics{ display:grid; gap:8px; } .kbasics p{ margin:2px 0 0; }
.kgrid{ display:grid; gap:8px; margin-top:8px; }
.kex{ display:grid; grid-template-columns:auto 96px 1fr; gap:10px; align-items:center; background:#fff9f0; border:1.5px solid var(--line); border-radius:14px; padding:8px 10px; cursor:pointer; font-weight:400; margin:0; }
.kex p{ margin:2px 0 0; } .kex input{ width:20px; height:20px; margin:0; accent-color:var(--wine); }
.kex:has(input:checked){ background:#eef6ea; border-color:#a9cf9a; }
.kfw{ position:relative; } .kn{ position:absolute; left:-4px; top:-4px; background:var(--wine); color:#fff; font:700 .7rem var(--font); width:18px; height:18px; border-radius:50%; display:grid; place-items:center; }
.kfig{ width:96px; height:58px; display:block; stroke:#5a3423; stroke-width:3.2; stroke-linecap:round; fill:none; background:#fdf3e4; border-radius:10px; }
.kfig .kh{ fill:#5a3423; stroke:none; } .kfig .kg{ stroke:#d8c3a5; stroke-width:1.5; } .kfig .ks{ fill:#d8c3a5; stroke:none; } .kfig .ka{ stroke:#c8735a; stroke-width:1.8; }
.kabc{ display:grid; gap:6px; margin-top:8px; }
.kabci{ display:flex; gap:10px; align-items:flex-start; justify-content:space-between; border-bottom:1px dashed var(--line); padding:6px 0; } .kabci p{ margin:2px 0 0; }
.kdose{ flex:none; background:#efe2cf; color:var(--wine); font:700 .78rem var(--font); padding:4px 8px; border-radius:8px; white-space:nowrap; }
button.lnk{ border:none; background:none; color:var(--wine); font:700 .85rem var(--font); padding:0; cursor:pointer; text-decoration:underline; }
</style>

/* Zeitziel -> nächstliegender Halbmarathon-Plan (Aderhold, 2018, S. 480 f.); ohne Ziel: ankommen -> ruhigster Plan */
const HM_REQ = { H215: 3600, H200: 3300, H150: 3000, H145: 2820 }; // Voraussetzung lt. Plan: 10 km in ca. …
function hmPlanForGoal(goal){ if (!goal) return 'H215'; const m = goal/60; if (m >= 130) return 'H215'; if (m >= 117) return 'H200'; if (m >= 108.5) return 'H150'; return 'H145'; }
function levelFrom10k(sec){ const m = sec/60;
  if (m > 62.5) return 'k65'; if (m > 57.5) return 'k60'; if (m > 52.5) return 'k55'; if (m > 48.5) return 'k50'; return 'k46'; }
/* Vorbereitungsblöcke nach längstem Lauf: Galloway & Galloway (2019) setzen für die Zeitziel-Programme
   einen langen Lauf von mind. 7 Meilen (ca. 11 km) voraus; darunter erst die Fortgeschrittenen-Zyklen (Aderhold, 2018, S. 468). */
function preBlocks(longestKm, level){ const a = LEVELS[level].a;
  if (longestKm < 8) return ['FG1','FG2',a]; if (longestKm < 11) return ['FG2',a]; return [a]; }

/* ===================== PLAN-LOGIK ===================== */
const DAY = 86400000;
function parseD(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d,12); }
function fmtD(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(s,n){ const d=parseD(s); d.setDate(d.getDate()+n); return fmtD(d); }
function mondayOf(s){ const d=parseD(s); const wd=(d.getDay()+6)%7; d.setDate(d.getDate()-wd); return fmtD(d); }
function daysBetween(a,b){ return Math.round((parseD(b)-parseD(a))/DAY); }
let TEST_DATE = null; // nur Ersteller: Datum simulieren
function todayS(){ return TEST_DATE || fmtD(new Date()); }
const WD = ['Mo','Di','Mi','Do','Fr','Sa','So'];
function niceD(s, opt){ return parseD(s).toLocaleDateString('de-DE', opt||{day:'2-digit',month:'2-digit',year:'numeric'}); }

/* Einheit parsen: 'EDL+ST 8/2' -> {code, arg, km} */
function parseSession(tok){

/* Kanonische Blockfolge für ein Niveau + längsten Lauf */
function canonFor(p){

/* Niveau aus Wohlfühl- und Durchschnittstempo schätzen (Formeln: Aderhold, 2018, S. 89):
   Wohlfühltempo ≈ extensiver Dauerlauf (EDL = TDL × 1,25) – gestützt auf Aderhold, 2018, S. 138 f. (wohlfühlen/unterhalten = 60–75 % HFmax);
   Durchschnittstempo ≈ Mitte zwischen EDL und IDL (IDL = TDL + 25 s) – ANNAHME DER APP, nicht aus den Büchern.
   Es wird die vorsichtigere (langsamere) Schätzung genommen; 10-km-Tempo = TDL − 15 s. */
function estimateLevel(avgSec, comfortSec){

/* Wählt n Wochen aus der Folge ab Position from, so dass der HM-Block am Ende liegt. */
function fitWeeks(canon, from, n){
  const notes=[];
  const preIdx=[], hmIdx=[];
  canon.forEach((c,k)=>{ if(k<from) return; (c.pre?preIdx:hmIdx).push(k); });
  if (n<=0) return {list:[],notes};
  if (hmIdx.length >= n) {
    if (hmIdx.length > n) notes.push('Die Zeit bis zum Rennen ist kürzer als der Halbmarathon-Block. Plane dein Renntempo lieber etwas verhaltener (Aderhold, 2018, S. 141).');
    return { list: hmIdx.slice(hmIdx.length-n), notes };
  }
  const A = n - hmIdx.length; let pre=[];
  if (preIdx.length <= A) {
    pre = preIdx.slice();
    // auffüllen: letzten Vorbereitungsblock wiederholen
    const lastPre = canon.filter(c=>c.pre).pop();
    if (pre.length < A) {
      const blockStart = canon.findIndex(c=>c.b===lastPre.b);
      const blockLen = PLANS[lastPre.b].weeks.length;
      let k=0; const fill=[];
      while (pre.length+fill.length < A){ fill.push(blockStart + (k%blockLen)); k++; }

    let sum = alloc.reduce((x,y)=>x+y,0); let j=blocks.length-1;
    while (sum < A){ if (alloc[j] < blocks[j].ks.length){ alloc[j]++; sum++; } j = (j-1+blocks.length)%blocks.length; }
    while (sum > A){ const m = alloc.indexOf(Math.max(...alloc)); alloc[m]--; sum--; }
    blocks.forEach((g,bi)=>{ const n=alloc[bi], L=g.ks.length; for (let q=0;q<n;q++) pre.push(g.ks[n===1?L-1:Math.round(q*(L-1)/(n-1))]); });
    notes.push('Die Vorbereitungswochen wurden an die Zeit bis zum Renntag angepasst.');

}

/* Trainingstage & Umfang

     diese zentralen Einheiten müssen erhalten bleiben (Aderhold, 2018, S. 138 f.). Bei 2 Lauftagen wechseln sich die beiden ersten Bausteine ab (ANNAHME DER APP).
   – Langsam aufbauen, den Kilometerumfang bedächtig steigern, lange Läufe kontinuierlich verlängern (Aderhold, 2018, S. 102);
     Entlastungswochen im Rhythmus 3:1, in denen der Umfang sinkt (Aderhold, 2018, S. 101).
     Die Umsetzung (Start beim aktuellen Wochenumfang, gleichmäßige Steigerung bis zum Halbmarathon-Block, Entlastungswoche ca. 20 % weniger) ist eine ANNAHME DER APP.
   – Krafttraining einmal pro Woche am gewählten Tag (Aderhold, 2018, S. 154 f.). */
const WEEK_KM = 25, PEAK_KM = 30, MIN_RUN = 5, START_MAX = 20;

function checkDays(d){
  const run = d.n===2 ? [d.A, d.L] : [d.A, d.B, d.L];
  if (new Set(run).size !== run.length) return { err:'Bitte wähle für jeden Lauf einen anderen Tag.' };
  if (d.K!=null && run.includes(d.K)) return { err:'Lege das Krafttraining auf einen Tag ohne Lauf.' };

    [0,2,1,3].forEach(x=>{ if (days.length<need && !days.includes(x)) days.push(x); }); days.sort((x,y)=>x-y);
    [row[0], row[2]].slice(0,need).forEach((tok,k)=>{ const s=mk(tok, days[k], k?'B':'A'); if(s) sessions.push(s); });

/* Startumfang und Steigerungsdauer festlegen (bei Planerstellung) */

function rwSince(p, monday){ return Math.max(0, daysBetween(mondayOf(p.start), monday)/7); }

/* kompletter Neuaufbau */

function plannedKm(state){ return state.weeks.reduce((a,w)=>a+w.sessions.reduce((b,s)=>b+(s.km||0),0),0); }

/* Pause eintragen + Anpassung */
function applyPause(state, from, to, reason){
  const days = daysBetween(from,to)+1;
  state.pauses.push({from,to,reason});
  // betroffene Einheiten als ausgefallen markieren
  state.weeks.forEach(w=>w.sessions.forEach(s=>{ if(!s.done && s.date>=from && s.date<=to) s.skipped=true; }));
  const msgs=[];
  if (reason==='fieber') msgs.push('Bei Fieber ist Sport tabu – erst vollständig auskurieren (Aderhold, 2018).');
  if (reason==='erkaeltung') msgs.push('Bei Erkältungszeichen hilft eine ausgelassene Einheit mehr als ein Lauf (Aderhold, 2018).');
  msgs.push('Verpasste Einheiten werden nicht nachgeholt (Aderhold, 2018, S. 104).');
  if (days < 7) { msgs.push('Die Pause war kürzer als eine Woche – dein Plan läuft ganz normal weiter.'); return msgs; }
  const pausedWeeks = Math.ceil(days/7);
  const back = addDays(to,1); const backMon = mondayOf(back);
  const raceMon = mondayOf(state.profile.race);
  const remaining = daysBetween(backMon, raceMon)/7 + 1;
  // Position im Plan beim Pausenbeginn
  const wIdx = state.weeks.findIndex(w=>w.monday===mondayOf(from));
  const pos = wIdx>=0 ? state.weeks[wIdx].ci : 0;
  const resume = Math.max(0, pos - pausedWeeks);
  const keep = state.weeks.filter(w=>w.monday < backMon);
  // Einheiten in der Rückkehrwoche vor dem Rückkehrtag als ausgefallen markieren
  const r = fitWeeks(state.canon, resume, remaining);
  const re = 2*pausedWeeks;
  const baseRw = wIdx>=0 && state.weeks[wIdx].rw!=null ? state.weeks[wIdx].rw : rwSince(state.profile, mondayOf(from));
  const rw0 = Math.max(0, baseRw - pausedWeeks);
  const neu = r.list.map((k,j)=>Object.assign(makeWeek(addDays(backMon,7*j), state.canon[k], j<re?'reentry':null, state.profile, rw0+j), {ci:k}));
  neu.forEach(w=>w.sessions.forEach(s=>{ if(s.date<back) s.skipped=true; }));
  const last = neu[neu.length-1]; if (last) last.sessions.forEach(s=>{ if(s.code==='HM') s.date=state.profile.race; });

  r.notes.forEach(n=>msgs.push(n));
  state.notices = r.notes;

}

/* Plan ab aktueller Woche neu berechnen (z. B. nach Zieländerung) */
function replanFromNow(state){
  const cur = mondayOf(todayS());
  const keep = state.weeks.filter(w=>w.monday < cur);
  state.canon = canonFor(state.profile);
  const raceMon = mondayOf(state.profile.race);
  const n = daysBetween(cur, raceMon)/7 + 1;
  const r = fitWeeks(state.canon, 0, n);
  const p = state.profile, old = state.weeks.find(w=>w.monday===cur);
  if (!p.startKm || !p.rampR){ const fl = r.list.length ? parseSession(PLANS[state.canon[r.list[0]].b].weeks[state.canon[r.list[0]].i][5]) : null; setupRamp(p, daysBetween(mondayOf(p.start), raceMon)/7 + 1, fl && fl.km); }

const normName = n => String(n||'').trim().replace(/\s+/g,' ');
const nameKey = n => normName(n).toLowerCase();
const isCreatorName = n => nameKey(n) === nameKey(CREATOR_NAME);

const Store = (() => {
  let online = false, user = null, saveTimer = 0;
  const cloud = () => !!(CLOUD.url && CLOUD.key) && !/claude/i.test(location.hostname) && location.protocol.startsWith('http');
  const LS = { get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }, del(k){ try { localStorage.removeItem(k); } catch(e){} } };
  async function rpc(fn, args){
    const r = await fetch(CLOUD.url.replace(/\/+$/,'') + '/rest/v1/rpc/' + fn, { method:'POST', headers:{ apikey:CLOUD.key, 'Content-Type':'application/json' }, body: JSON.stringify(args||{}) });
    const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch(e){}
    if (!r.ok){ const m = (j && (j.message||j.hint)) || ('HTTP '+r.status); const e = new Error(m); e.server = true; throw e; }
    return j;
  }
  const MSG = { name_taken:'Dieser Name ist schon vergeben.', login_failed:'Name oder Passwort stimmt nicht.', pw_short:'Das Passwort braucht mindestens 6 Zeichen.', name_invalid:'Der Name muss 2–30 Zeichen lang sein.' };
  const errText = e => MSG[e.message] || (e.server ? 'Fehler vom Server: '+e.message : 'Keine Verbindung zum Server. Bitte später nochmal versuchen.');

  async function init(){
    if (cloud()){
      try { await rpc('app_scores'); online = true; } catch(e){ online = !!e.server; console.warn('Server:', e.message); }
      if (online){ const sess = LS.get('mwah-cloud');
        if (sess && sess.token){ try { const r = await rpc('app_load', { p_token: sess.token }); user = { id:sess.token, name:r.name, creator:isCreatorName(r.name), remote:r.data }; }
          catch(e){ if (e.server) LS.del('mwah-cloud'); else user = { id:sess.token, name:sess.name, creator:isCreatorName(sess.name) }; } } }
    }
    if (!online){ const sess = LS.get('mwah-session'); const users = LS.get('mwah-users')||{};
      if (sess && users[sess]) user = { id:sess, name:users[sess].name, creator:isCreatorName(users[sess].name) }; }
    return user;
  }
  function check(name, pw){
    name = normName(name);
    if (name.length < 2) return 'Bitte gib einen Namen mit mindestens 2 Zeichen ein.';
    if (name.length > 30) return 'Der Name darf höchstens 30 Zeichen lang sein.';
    if (String(pw||'').length < 6) return 'Das Passwort braucht mindestens 6 Zeichen.';
    return null;
  }
  async function register(name, pw){
    const err = check(name, pw); if (err) return { err }; name = normName(name);
    if (online){ try { const r = await rpc('app_register', { p_name:name, p_pw:pw }); LS.set('mwah-cloud', { token:r.token, name:r.name });
        user = { id:r.token, name:r.name, creator:isCreatorName(r.name), remote:null }; return { user }; } catch(e){ return { err: errText(e) }; } }
    const users = LS.get('mwah-users')||{}; const key = nameKey(name);
    if (users[key]) return { err:'Dieser Name ist auf diesem Gerät schon vergeben.' };
    const salt = Math.random().toString(36).slice(2,12);
    users[key] = { name, salt, hash: sha256(salt+pw) }; LS.set('mwah-users', users); LS.set('mwah-session', key);
    user = { id:key, name, creator:isCreatorName(name) }; return { user };
  }
  async function login(name, pw){
    name = normName(name); if (!name || !pw) return { err:'Bitte Name und Passwort eingeben.' };
    if (online){ try { const r = await rpc('app_login', { p_name:name, p_pw:pw }); LS.set('mwah-cloud', { token:r.token, name:r.name });
        const d = await rpc('app_load', { p_token:r.token }); user = { id:r.token, name:r.name, creator:isCreatorName(r.name), remote:d.data }; return { user }; } catch(e){ return { err: errText(e) }; } }
    const users = LS.get('mwah-users')||{}; const u = users[nameKey(name)];
    if (!u || u.hash !== sha256(u.salt+pw)) return { err:'Name oder Passwort stimmt nicht.' };
    LS.set('mwah-session', nameKey(name)); user = { id:nameKey(name), name:u.name, creator:isCreatorName(u.name) }; return { user };
  }
  async function logout(){ LS.del('mwah-cloud'); LS.del('mwah-session'); user = null; }
  async function loadData(){
    if (!user) return null; const key = 'mwah-data-'+(online ? 'c-'+nameKey(user.name) : user.id);
    if (online && user.remote){ LS.set(key, user.remote); return user.remote; }
    return LS.get(key);
  }
  function score(S){ const items = GEAR.filter(g=>S.game.gear[g.id]).length; const coins = Object.values(S.game.best||{}).reduce((a,b)=>a+b,0);
    return { km: totalKm(S), items, coins }; }
  function saveData(S){
    if (!user) return; const sc = score(S);
    if (online){ LS.set('mwah-data-c-'+nameKey(user.name), S); clearTimeout(saveTimer);
      saveTimer = setTimeout(()=>{ rpc('app_save', { p_token:user.id, p_data:S, p_km:sc.km, p_items:sc.items, p_coins:sc.coins }).catch(e=>console.warn('Speichern:', e.message)); }, 1000); return; }
    LS.set('mwah-data-'+user.id, S);
    const all = LS.get('mwah-scores')||{}; all[user.id] = Object.assign({ name:user.name, creator:user.creator }, sc); LS.set('mwah-scores', all);
  }
  async function scores(){
    if (online){ try { const d = await rpc('app_scores'); return (d||[]).filter(r=>!isCreatorName(r.name)); } catch(e){ return []; } }
    const all = LS.get('mwah-scores')||{}; return Object.values(all).filter(r=>!r.creator);
  }
  return { init, register, login, logout, loadData, saveData, scores, get user(){ return user; }, get mode(){ return online ? 'cloud' : 'local'; } };
})();

      for (const e of lv.ents){ if (e.t==='enemy' && e.alive && hit(b,e)){ e.alive=false; e.ko=60; e.vy=-3.5; e.spin=0; b.dead=true; Music.sfx('ko'); puff(e.x+7,e.y+7,'#ffd23f',10); break; } }
      const bo = G.boss; if (!b.dead && bo && bo.st!=='dead' && hit(b,bo)){ b.dead=true;
        if (bo.st==='stun'){ bo.hp-=0.5; bo.flash=16; Music.sfx('bosshit'); puff(b.x,b.y,'#ffd23f',10); if (bo.hp<=0){ bo.st='dead'; endGame(true); return; } }
        else { puff(b.x,b.y,'#e4e1dc',6); G.klonk=20; Music.sfx('klonk'); } }
      if (b.life<=0) b.dead=true; }
    G.pretz = G.pretz.filter(b=>!b.dead); if (G.klonk>0) G.klonk--;
    for (const e of lv.ents){ if (e.t==='enemy' && !e.alive && e.ko>0){ e.ko--; e.y+=e.vy; e.vy+=0.3; e.spin+=0.25; } }

    for (const e of lv.ents){
      if (e.t==='coin' && !e.got && hit(p,e)){ e.got=true; G.coins++; if (G.cfg.mode==='level' || G.cfg.collect==='🥨') G.ammo++; Music.sfx('coin'); puff(e.x+6,e.y+6,'#ffd23f',5); }
      else if (e.t==='item' && !e.got && hit(p,e)){ e.got=true; G.gotItem=true; G.worn=Object.assign({},G.worn||{},{[GEAR[e.gear].id]:true}); Music.sfx('item'); puff(e.x+8,e.y+8,'#fff',20); toast(GEAR[e.gear].icon+' '+GEAR[e.gear][S.game.lang]+'!'); }
      else if (e.t==='check' && !e.on && p.x > e.x){ e.on=true; G.spawn={ x:e.x, y:e.y-10 }; }
      else if (e.t==='goal' && p.x+p.w > e.x+16){ endGame(true); return; }
      else if (e.t==='enemy' && e.alive){
        e.x += e.vx; const fx = e.vx<0 ? e.x-1 : e.x+e.w+1, ty = Math.floor((e.y+e.h+2)/T), tx=Math.floor(fx/T);
        if (!solid(lv,tx,ty) || solid(lv,tx,Math.floor((e.y+e.h-2)/T))) e.vx = -e.vx;
        if (hit(p,e)){ if (p.vy>0 && p.y+p.h-e.y < 10){ e.alive=false; p.vy=-6; Music.sfx('stomp'); puff(e.x+7,e.y+7,'#b48cff',12); } else hurt(); }
      }
    }
    // Silvester: Timer + Funken
    if (G.cfg.timer!=null){ G.cfg.timer--; if (G.cfg.timer<=0) return endGame(false, 'time');
      if (G.t % Math.max(18, 40-Math.floor(G.t/400)) === 0) G.sparks.push({ x:p.x - 40 + Math.random()*220, y:-10, vy:1.4+Math.random()*1.4, w:8, h:8 });
      G.sparks.forEach(s=>{ s.y+=s.vy; if (hit(p,s)){ s.y=999; hurt(); } }); G.sparks = G.sparks.filter(s=>s.y<VH+20); }
    if (G.theme.snow && G.t%3===0) G.snow.push({ x:G.cam+Math.random()*VW, y:-5, v:0.5+Math.random(), d:Math.random()*6 });
    G.snow.forEach(s=>{ s.y+=s.v; s.x+=Math.sin((G.t+s.d*20)/30)*0.3; }); G.snow = G.snow.filter(s=>s.y<VH);
    if (boss) bossStep();
    G.shots.forEach(s=>{ s.x+=s.vx; s.y+=s.vy; s.vy+=0.22; if (hit(p,s)){ s.dead=true; hurt(); } if (s.y>10*T) { s.dead=true; puff(s.x,s.y,'#f3c1d9',4); } });
    G.shots = G.shots.filter(s=>!s.dead);
    G.parts.forEach(q=>{ q.x+=q.vx; q.y+=q.vy; q.vy+=0.12; q.life--; }); G.parts = G.parts.filter(q=>q.life>0);
    G.cam = Math.max(0, Math.min(lv.len*T-VW, p.x - VW*0.38)); if (G.shake>0) G.shake--;
  }

  function bossStep(){
    const b = G.boss, p = G.p; b.vy = Math.min(10, b.vy+0.42); moveBody(b, G.lv); if (b.flash>0) b.flash--;
    const dx = (p.x+p.w/2) - (b.x+b.w/2); const ph = 6 - b.hp;
    if (b.st==='intro'){ if (--b.tm<=0){ b.st='walk'; b.tm=110; } }
    else if (b.st==='walk'){ b.face = Math.sign(dx)||1; b.vx = b.face*(0.8+ph*0.18); if (--b.tm<=0){ b.vx=0; if (Math.random()<0.6){ b.st='leap'; b.vy=-8.4; b.vx=Math.max(-3.2,Math.min(3.2,dx/45)); b.air=true; } else { b.st='throw'; b.tm=70; b.n=0; } } }
    else if (b.st==='leap'){ if (b.on && b.air){ b.air=false; b.vx=0; G.shake=14; puff(b.x+b.w/2,b.y+b.h,'#c9b79c',18);
        if (p.on && Math.abs(dx)<80) hurt(); b.st='stun'; b.tm = b.stunMax = 110 - ph*8; } }
    else if (b.st==='stun'){ b.vx=0; if (--b.tm<=0){ b.st='walk'; b.tm=100; } }
    else if (b.st==='throw'){ b.vx=0; b.tm--; if (b.tm%22===0 && b.n<3){ b.n++; G.shots.push({ x:b.x+b.w/2, y:b.y+6, vx:dx/55 + (Math.random()-0.5), vy:-5.2, w:12, h:9 }); } if (b.tm<=0){ b.st='walk'; b.tm=100; } }
    else if (b.st==='hurt'){ b.vx=0; if (--b.tm<=0){ b.st='walk'; b.tm=90; } }
    if (hit(p,b) && b.st!=='dead'){
      const fromTop = p.vy>0 && p.y+p.h - b.y < 14;
      if (fromTop && b.st==='stun'){ b.hp--; b.flash=30; Music.sfx('bosshit'); p.vy=-7.5; puff(b.x+b.w/2,b.y,'#ffd23f',16); G.shake=8;
        if (b.hp<=0){ b.st='dead'; endGame(true); } else { b.st='hurt'; b.tm=40; } }
      else if (fromTop){ p.vy=-6.5; }
      else if (b.st!=='stun' && b.st!=='hurt') hurt();
    }
  }

  /* ---------- Zeichnen ---------- */
  function draw(){
    const th = G.theme, lv = G.lv;
    ctx.save(); ctx.setTransform(scale,0,0,scale,0,0);
    if (G.shake) ctx.translate((Math.random()-0.5)*G.shake*0.6, (Math.random()-0.5)*G.shake*0.6);
    const g = ctx.createLinearGradient(0,0,0,VH); g.addColorStop(0,th.sky[0]); g.addColorStop(1,th.sky[1]); ctx.fillStyle=g; ctx.fillRect(-10,-10,VW+20,VH+20);
    deco(th.deco, G.cam);
    if (th.river){ ctx.fillStyle = th.night ? '#1d3a6b' : '#4f8fbf'; ctx.fillRect(0, ROWS*T-16, VW, 16); ctx.fillStyle='rgba(255,255,255,.35)'; for(let i=0;i<14;i++){ const xx=((i*37 - G.cam*0.9 + G.t*0.4)%VW+VW)%VW; ctx.fillRect(xx, ROWS*T-10+(i%3)*3, 10, 1.5); } }
    ctx.translate(-Math.round(G.cam), 0);
    const x0 = Math.floor(G.cam/T), x1 = Math.min(lv.len-1, x0+Math.ceil(VW/T)+1);
    for (let tx=x0;tx<=x1;tx++) for (let ty=0;ty<ROWS;ty++){ const v=lv.tiles[ty*lv.len+tx]; if(!v) continue; tile(v, tx*T, ty*T, th); }
    lv.wind.forEach(w=>{ if (w.x1<G.cam||w.x0>G.cam+VW) return; ctx.strokeStyle = w.f<0?'rgba(255,255,255,.7)':'rgba(255,240,150,.8)'; ctx.lineWidth=1.2; for(let i=0;i<6;i++){ const yy=60+((i*53)%120); const ph=(G.t*(w.f<0?-3:3)+i*40)%(w.x1-w.x0); const xx=w.x0+((ph+(w.x1-w.x0))%(w.x1-w.x0)); ctx.beginPath(); ctx.moveTo(xx,yy); ctx.lineTo(xx+(w.f<0?-14:14),yy); ctx.stroke(); } });
    for (const e of lv.ents){
      if (e.x < G.cam-40 || e.x > G.cam+VW+40) continue;
      if (e.t==='coin' && !e.got) emoji(e.icon, e.x+6, e.y+7+Math.sin((G.t+e.x)/12)*1.5, 12);
      if (e.t==='item' && !e.got){ ctx.fillStyle='rgba(255,255,200,'+(0.35+0.25*Math.sin(G.t/8))+')'; ctx.beginPath(); ctx.arc(e.x+8,e.y+8,13,0,7); ctx.fill(); emoji(GEAR[e.gear].icon, e.x+8, e.y+9+Math.sin(G.t/10)*2, 15); }
      if (e.t==='check'){ ctx.fillStyle='#555'; ctx.fillRect(e.x, e.y, 2, 26); ctx.fillStyle = e.on ? '#3ccf6e' : '#e04848'; ctx.beginPath(); ctx.moveTo(e.x+2,e.y); ctx.lineTo(e.x+14,e.y+5); ctx.lineTo(e.x+2,e.y+10); ctx.fill(); }
      if (e.t==='goal') goal(e);
      if (e.t==='enemy' && e.alive) excuse(e); else if (e.t==='enemy' && e.ko>0) koPig(e);
    }
    G.sparks.forEach(s=>{ ctx.fillStyle='#ffdd55'; ctx.beginPath(); ctx.arc(s.x+4,s.y+4,3+Math.random()*1.5,0,7); ctx.fill(); ctx.fillStyle='rgba(255,120,40,.6)'; ctx.fillRect(s.x+3,s.y-8,2,8); });
    if (G.boss) drawBoss(G.boss);
    G.pretz.forEach(b=>{ ctx.save(); ctx.translate(b.x+4.5,b.y+4.5); ctx.rotate(b.rot); emoji('🥨',0,0,10); ctx.restore(); });
    if (G.klonk && G.boss){ ctx.fillStyle='#fff'; ctx.font='bold 9px system-ui'; ctx.textAlign='center'; ctx.fillText(S.game.lang==='de'?'Klonk! Erst wenn er benommen ist!':'Clonk! Only when it is dazed!', G.boss.x+G.boss.w/2, G.boss.y-28); }
    G.shots.forEach(s=>{ ctx.fillStyle='#8e2433'; rr(s.x,s.y,12,9,3); ctx.fill(); ctx.strokeStyle='#d9a640'; ctx.lineWidth=1; ctx.stroke(); ctx.fillStyle='#4a0f1a'; ctx.beginPath(); ctx.arc(s.x+6,s.y+4.5,1,0,7); ctx.fill(); });

    G.parts.forEach(q=>{ ctx.globalAlpha=q.life/30; ctx.fillStyle=q.c; ctx.fillRect(q.x,q.y,3,3); }); ctx.globalAlpha=1;
    ctx.translate(Math.round(G.cam),0);

    if (G.theme.night && G.cfg.mode!=='nye' && G.cfg.mode!=='xmas'){ ctx.fillStyle='rgba(5,10,30,.18)'; ctx.fillRect(0,0,VW,VH); }

  }
  function rr(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
  function emoji(c,x,y,s){ ctx.fillStyle='#fff'; ctx.font = s+'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(c,x,y); }
  function tile(v,x,y,th){
    if (v===3){ ctx.fillStyle = '#c98e6c'; ctx.fillRect(x,y,T,8); ctx.fillStyle='rgba(255,240,220,.45)'; ctx.fillRect(x,y,T,2); ctx.fillStyle='#5a3a26'; ctx.fillRect(x,y+7,T,1.5); return; }

  function goal(e){

      ctx.fillStyle='#6b4a2b'; ctx.fillRect(e.x+16,e.y+60-6,8,8); emoji('⭐',e.x+20,e.y-8,14);
      for(let i=0;i<8;i++){ ctx.fillStyle=['#ff5252','#ffd23f','#5bc0ff'][i%3]; ctx.beginPath(); ctx.arc(e.x+8+(i*7)%26, e.y+14+(i*11)%40, 2,0,7); ctx.fill(); } return; }

  function excuse(e){ // kleiner Schweinehund (Gehilfe) mit Ausrede

    ctx.fillStyle='#8c4fa0'; ctx.beginPath(); ctx.ellipse(-1,7,8,5.5,0,0,7); ctx.fill(); ctx.stroke();
    ctx.strokeStyle='#7a4a24'; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(-2,2); ctx.lineTo(-2,12); ctx.stroke(); ctx.fillStyle='#d9a640'; ctx.fillRect(-3,6,2,2);
    ctx.strokeStyle=O; ctx.lineWidth=1.1; ctx.beginPath(); ctx.moveTo(-8,5); ctx.quadraticCurveTo(-12,1,-9,0); ctx.stroke();

  }
  function koPig(e){ ctx.save(); ctx.translate(e.x+7.5, e.y+7); ctx.rotate(e.spin); ctx.translate(-(e.x+7.5), -(e.y+7)); const al=e.alive; excuse(Object.assign({}, e, { txt:'', vx:-1 })); ctx.restore();
    if (e.ko>30){ ctx.fillStyle='#fff'; ctx.strokeStyle='#7b3f8c'; ctx.lineWidth=2.5; ctx.font='bold 10px system-ui'; ctx.textAlign='center'; ctx.strokeText('K.O.!', e.x+8, e.y-12); ctx.fillText('K.O.!', e.x+8, e.y-12); } }
  function drawPlayer(p){ // Outfit wächst mit der gesammelten Ausrüstung: anfangs Tunika + Sandalen, am Ende komplette Läuferausrüstung
    if (p.inv>0 && Math.floor(p.inv/4)%2) return;
    const gear = Object.assign({}, S.game.gear, G.worn||{}), x=p.x, y=p.y, f=p.face, a=p.on?Math.sin(p.anim)*4:2, O='#3b2216', SK='#e0a37e';

    // Socken

    // Schuhe: Laufschuhe oder Sandalen

    else { ctx.fillStyle='#7a4a24'; [a*0.8,-a*0.8].forEach(fx=>ctx.fillRect(fx-2,17.4,5,1.4)); ctx.strokeStyle='#7a4a24'; ctx.lineWidth=0.8; [a*0.8,-a*0.8].forEach(fx=>{ ctx.beginPath(); ctx.moveTo(fx-1,15); ctx.lineTo(fx+2,17.4); ctx.stroke(); }); }
    ctx.strokeStyle=O; ctx.lineWidth=0.8;
    if (gear.shirt){ // Funktionsshirt (Singlet) + kurze Laufhose
      ctx.fillStyle='#22313f'; ctx.beginPath(); ctx.moveTo(-4.6,10.4); ctx.lineTo(4.6,10.4); ctx.lineTo(5,13.4); ctx.lineTo(0.6,13.4); ctx.lineTo(0,12.4); ctx.lineTo(-0.6,13.4); ctx.lineTo(-5,13.4); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#22b3b8'; ctx.beginPath(); ctx.moveTo(-3.6,4.6); ctx.lineTo(-1.6,4.6); ctx.quadraticCurveTo(0.4,6.4,2.2,4.6); ctx.lineTo(3.8,4.6); ctx.lineTo(4.6,10.8); ctx.lineTo(-4.6,10.8); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#ffd23f'; ctx.fillRect(-4.3,7.2,8.6,0.8);
    } else { // Tunika (creme) mit Gürtel und Fibel
      ctx.fillStyle='#f1e6cf'; ctx.beginPath(); ctx.moveTo(-4,5); ctx.lineTo(4,5); ctx.lineTo(5.5,13); ctx.lineTo(-5.5,13); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle='#6b3a1e'; ctx.fillRect(-4.6,9,9.2,1.4); ctx.fillStyle='#d9a640'; ctx.fillRect(-0.6,8.8,1.6,1.8);
      ctx.fillStyle='#8e2433'; ctx.beginPath(); ctx.moveTo(-4,5); ctx.lineTo(3,5); ctx.lineTo(-1,8); ctx.fill(); ctx.fillStyle='#d9a640'; ctx.beginPath(); ctx.arc(1.5,5.6,1,0,7); ctx.fill();

let S = null;

const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function blank(){ return { v:3, profile:null, weeks:[], canon:[], notices:[], pauses:[], extra:[], dev:{ testDate:null },
  game:{ lang:'de', gear:{}, done:{}, best:{}, unlocked:{}, thresholds:[], bossWon:false, xmasWon:false, nyeWon:false, advent:{}, seenIntro:false } }; }
function normalize(s){ const b=blank(); if(!s) return b; s.game = Object.assign(b.game, s.game||{}); s.dev = Object.assign(b.dev, s.dev||{}); s.extra=s.extra||[]; s.pauses=s.pauses||[]; return s; }
function save(){ if (S) Store.saveData(S); }
function applyTestDate(){ TEST_DATE = (isCreator() && S && S.dev.testDate) ? S.dev.testDate : null; }

/* ---------- Hilfen ---------- */
function curWeekIdx(){ const m = mondayOf(todayS()); let i = S.weeks.findIndex(w=>w.monday===m); if (i<0) i = todayS() < S.weeks[0].monday ? 0 : S.weeks.length-1; return i; }
function daysToRace(){ return daysBetween(todayS(), S.profile.race); }
function myPaces(){ if (!S.profile.tenK) return null; const P = paces(S.profile.tenK); if (S.profile.goal){ P.HMtime = S.profile.goal; P.HM = S.profile.goal/21.0975; } return P; }
function parseGoal(v){ v=String(v||'').trim().replace(',',':').replace('.',':').replace(/\s*h$/i,''); if (!v) return null; const p=v.split(':').map(Number); if (p.some(isNaN)) return null;
  if (p.length===1) return p[0]>=60 && p[0]<=300 ? p[0]*60 : null; if (p.length===2) return p[0]<=5 ? p[0]*3600+p[1]*60 : p[0]*60+p[1]; return p[0]*3600+p[1]*60+p[2]; }
function goalText(g){ return g ? fmtTime(g).replace(/:00$/,'')+' h' : 'Ankommen'; }
function dayIndex(){ return Math.floor(parseD(todayS())/DAY); }
function hfMax(){ const p=S.profile; if (p.noHR) return null; if (p.hfmax) return p.hfmax; if (p.age) return 220 - p.age; return null; }
function intensity(code){ const t=TYPES[code]; if(!t) return ''; if (S.profile.noHR) return t.feel ? 'Gefühl: '+t.feel : '';
  const hf=hfMax(); const m=(t.hf||'').match(/(\d+)–(\d+) %/), m1=(t.hf||'').match(/ca\. (\d+) %/);
  if (hf && m) return t.hf+' ≈ '+Math.round(hf*m[1]/100)+'–'+Math.round(hf*m[2]/100)+' Schläge/min'; if (hf && m1) return t.hf+' ≈ '+Math.round(hf*m1[1]/100)+' Schläge/min'; return t.hf; }
function streak(){ let s=0; const cur=curWeekIdx(); for (let i=cur;i>=0;i--){ const any=S.weeks[i].sessions.some(x=>x.done); if (any) s++; else if (i===cur) continue; else break; } return s; }
function levelUnlocked(i){ const gs=S.game; if (isCreator() || gs.unlocked[i] || todayS() >= UNLOCK_ALL_DATE) return true; const t=gs.thresholds[i]; return t!=null && totalKm(S) >= t; }
function syncUnlocks(){ S.game.thresholds = computeThresholds(S); const k=totalKm(S); let newly=[]; S.game.thresholds.forEach((t,i)=>{ if(!S.game.unlocked[i] && ((t!=null && k>=t) || todayS()>=UNLOCK_ALL_DATE)){ S.game.unlocked[i]=true; newly.push(i);} }); return newly; }
function kmToNext(){ const k=totalKm(S); const th=S.game.thresholds; const i=th.findIndex((t,j)=>t!=null && !levelUnlocked(j)); return i<0?null:{ lvl:i+1, need: Math.max(0.1, Math.round((th[i]-k)*10)/10) }; }
function bossOpen(){ return isCreator() || todayS() >= UNLOCK_ALL_DATE; }
function fmtDur(sec){ if(!sec) return ''; return fmtTime(sec); }
function logSummary(o){ const parts=[]; const km = o.kmDone!=null?o.kmDone:o.km; if (km) parts.push(String(km).replace('.',',')+' km');
  if (o.time){ parts.push(fmtDur(o.time)); if (km) parts.push('Ø '+fmtPace(o.time/km)+' min/km'); }
  if (o.hr) parts.push('Ø '+o.hr+' S/min'); if (o.hm) parts.push(o.hm+' Hm'); return parts.join(' · '); }

/* ---------- Plan ---------- */
function renderPlan(){
  const cur = curWeekIdx(); let lastB = null; const p=S.profile; const hmKey = hmPlanForGoal(p.goal), hmPlan = PLANS[hmKey]; const ambitious = p.goal && p.tenK > HM_REQ[hmKey] + 90;
  const html = S.weeks.map((w,wi)=>{
    const head = w.b!==lastB ? `<div class="block-h"><h3>${esc(w.title)}</h3><span class="src">${esc(w.src)}</span></div>` : ''; lastB = w.b;
    const done = w.sessions.filter(s=>s.done).length, km = w.sessions.reduce((a,s)=>a+(s.km||0),0);
    return head + `<details class="week ${wi===cur?'cur':''} ${w.flag||''}" ${wi===cur?'open':''}><summary><span class="wn">W${wi+1}</span><span class="wd">${niceD(w.monday,{day:'2-digit',month:'2-digit'})}</span><span class="wt">Woche ${w.i+1}${w.flag==='reentry'?' · Wiedereinstieg':''}</span><span class="wk">${km?Math.round(km)+' km':''}</span><span class="wdn">${done}/${w.sessions.length}</span></summary>${weekSessions(wi)}</details>`;
  }).join('');
  $('#view').innerHTML = `<div class="sec-h"><h2>Dein Plan</h2><div class="row"><button class="btn sm ghost" onclick="openDays()">Tage ändern</button><button class="btn sm ghost" onclick="openGoal()">Ziel ändern</button></div></div>
    <section class="card"><p><b>Dein Ausgangsniveau:</b> längster Lauf ${String(p.longest||'–').replace('.',',')} km · Wohlfühltempo ${p.comfort?fmtPace(p.comfort):'–'} min/km · Ø ${p.avg?fmtPace(p.avg):'–'} min/km</p>
      <p>Daraus ergibt sich etwa eine 10-km-Leistung von <b>${fmtTime(p.tenK)}</b> min.</p>
      <p>🎯 <b>Dein Ziel: ${goalText(p.goal)}</b> → Halbmarathon-Plan <b>${esc(hmPlan.target)}</b>${p.goal?'':' (der ruhigste Plan – ideal, um gut anzukommen)'}.</p>
      ${ambitious?`<p class="warnbox">Dein Ziel ist ehrgeizig: Dieser Plan setzt etwa 10 km in ${fmtTime(HM_REQ[hmKey])} min voraus, nach deinen Angaben liegst du derzeit bei ca. ${fmtTime(p.tenK)} min. Die erreichbare Zeit realistisch einschätzen und lieber verhaltener angehen (Aderhold, 2018, S. 141).</p>`:''}
      <details class="gl"><summary class="small"><b>So schätzt die App dein Niveau</b></summary><p class="small">Dein <b>Wohlfühltempo</b> wird als gemütlicher Dauerlauf gewertet (im Buch: extensiver Dauerlauf): Aderhold beschreibt die Belastung, bei der man sich wohlfühlt und noch unterhalten kann, mit 60–75 % der maximalen Herzfrequenz – das entspricht etwa dem regenerativen bis extensiven Dauerlauf (Aderhold, 2018, S. 138 f.). Dass dein <b>Durchschnittstempo</b> zwischen gemütlichem und zügigem Dauerlauf liegt (im Buch: zwischen extensivem und intensivem Dauerlauf), ist eine <b>Annahme der App</b>, die so nicht in den Büchern steht. Aus beidem berechnet die App mit Aderholds Tempoformeln (S. 89) deine 10-km-Leistung und nimmt vorsichtshalber den langsameren Wert.</p></details>
      <p class="src">Pläne: Aderhold, 2018, S. 468–481</p></section>
    <section class="card note"><p class="small">📅 <b>Deine Woche:</b> ${daysSummary(daysOf(p))}</p>
      <p class="small">📈 <b>Langsam steigern:</b> Dein Plan beginnt bei etwa ${String(p.startKm||'–').replace('.',',')} km pro Woche und steigert sich bis zum Halbmarathon-Block gleichmäßig auf bis zu 25 km, in den Wochen mit dem längsten Lauf auf bis zu 30 km. Jede 4. Woche ist eine leichtere Entlastungswoche. Aderhold rät, langsam aufzubauen, den Kilometerumfang bedächtig zu steigern und die langen Läufe kontinuierlich zu verlängern (Aderhold, 2018, S. 102), mit Entlastungswochen im Rhythmus 3:1 (S. 101). Die genaue Umsetzung (Startwert, gleichmäßige Steigerung, ca. 20 % weniger in Entlastungswochen) ist eine <b>Annahme der App</b>; die Obergrenzen von 3 Läufen und 25/30 km sind eine Vorgabe der Kursleitung.</p></section>
    <p class="muted small">Passt ein Tag mal nicht, verschiebe die Einheit – und lass zwischen fordernden Einheiten Ruhetage. Tippe auf eine Trainingsform (ⓘ) für die Erklärung.</p>
    ${S.notices.length?`<div class="card note">${S.notices.map(n=>`<p>ℹ️ ${esc(n)}</p>`).join('')}</div>`:''}
    ${S.pauses.length?`<div class="card"><b>Eingetragene Pausen</b>${S.pauses.map(x=>`<p class="small">${niceD(x.from)} – ${niceD(x.to)} (${({fieber:'Krankheit mit Fieber',erkaeltung:'Erkältung',verletzung:'Verletzung',sonst:'Sonstiges'})[x.reason]})</p>`).join('')}</div>`:''}
    ${html}
    ${S.extra.length?`<h3 class="mt">Zusätzliche Läufe</h3>${S.extra.map(e=>`<div class="sess done"><div class="sx"><div class="sd">${niceD(e.date)}</div><div class="sl">${esc(logSummary(e))}</div></div></div>`).join('')}`:''}`;
  bindSessions();
  const c = document.querySelector('.week.cur'); if (c) setTimeout(()=>c.scrollIntoView({block:'center'}),30);
}

/* ---------- Dialoge ---------- */
function sheet(html){ const el=$('#sheet'); el.querySelector('.sbody').innerHTML = html; el.classList.remove('hidden'); }
function closeSheet(){ $('#sheet').classList.add('hidden'); }
function alertBox(t){ sheet(`<p>${esc(t)}</p><button class="btn" onclick="closeSheet()">OK</button>`); }
let toastTimer=0; function toastMsg(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),3200); }

function openPause(){
  sheet(`<h3>Pause eintragen</h3><p class="muted">Krank, verletzt oder einfach keine Zeit? Trag den Zeitraum ein – die App passt deinen Plan an.</p>
    <form id="pf"><label>Von<input type="date" name="from" value="${todayS()}" required></label><label>Bis (letzter Pausentag)<input type="date" name="to" value="${todayS()}" required></label>
    <label>Grund<select name="r"><option value="erkaeltung">Erkältung</option><option value="fieber">Krankheit mit Fieber</option><option value="verletzung">Verletzung</option><option value="sonst">Sonstiges (Urlaub, Termine …)</option></select></label>
    <p class="small muted">Verpasstes wird nicht nachgeholt. Nach einer Woche Pause braucht man etwa zwei Wochen zurück zum alten Stand; bei Fieber kein Sport (Aderhold, 2018, S. 104). Verletzungen bitte ärztlich abklären lassen.</p>
    <div class="row"><button type="button" class="btn ghost" onclick="closeSheet()">Abbrechen</button><button class="btn">Plan anpassen</button></div></form>`);
  $('#pf').onsubmit = e => { e.preventDefault(); const f=new FormData(e.target); const from=f.get('from'), to=f.get('to');
    if (to<from) return alertBox('„Bis“ muss nach „Von“ liegen.');
    const msgs = applyPause(S, from, to, f.get('r')); save(); renderApp();
    sheet(`<h3>Plan angepasst 💪</h3>${msgs.map(m=>`<p>• ${esc(m)}</p>`).join('')}<p class="quote-inline">„${esc(MOTIVATION[0].t)}“ <span class="src">(${MOTIVATION[0].src})</span></p><button class="btn" onclick="closeSheet()">Weiter geht's</button>`); };
}
function openExtra(){
  sheet(`<h3>Zusätzlicher Lauf</h3><form id="xf"><label>Datum<input type="date" name="d" value="${todayS()}"></label>${logFields({})}<div class="row"><button type="button" class="btn ghost" onclick="closeSheet()">Abbrechen</button><button class="btn">Speichern</button></div></form>`);
  $('#xf').onsubmit = e => { e.preventDefault(); const f=new FormData(e.target); const o={ date:f.get('d') }; readLog(f,o); o.km=o.kmDone||0; delete o.kmDone;
    if (!o.km) return alertBox('Bitte trag zumindest die Kilometer ein.'); const before=totalKm(S); S.extra.push(o); closeSheet(); afterKm(before); };
}
function openGoal(){
  const p=S.profile;
  sheet(`<h3>🎯 Zeitziel ändern</h3><p class="muted small">Ab dieser Woche wird dein Plan an das neue Ziel angepasst; Vergangenes bleibt erhalten.</p>
    <label>Zeitziel (Stunden:Minuten)<input id="ng" placeholder="z. B. 2:05" value="${p.goal?fmtTime(p.goal).replace(/:00$/,''):''}" inputmode="numeric"></label>
    <label class="radio"><input type="checkbox" id="na" ${p.goal?'':'checked'}> Ich will einfach ankommen</label>
    <p class="small muted">Die App wählt den passenden Halbmarathon-Plan: 2:15–2:20 h, 2:00–2:05 h, 1:50–1:52 h oder 1:45–1:47 h (Aderhold, 2018, S. 480 f.).</p><p id="ge" class="err"></p>
    <div class="row"><button class="btn ghost" onclick="closeSheet()">Abbrechen</button><button class="btn" id="ngb">Übernehmen</button></div>`);
  $('#ng').oninput = () => { $('#na').checked = !$('#ng').value.trim(); };

    changeGoal(S, g); syncUnlocks(); save(); closeSheet(); renderApp('plan'); toastMsg('🎯 Neues Ziel: '+goalText(g)+' – Plan angepasst.'); };
}

/* Spiel-Overlay */
function gPanel(html){ const p=$('#gpanel'); p.innerHTML = html; p.classList.remove('hidden'); }
function gHide(){ $('#gpanel').classList.add('hidden'); }
function showOverlay(){ $('#gov').classList.remove('hidden'); document.body.classList.add('noscroll'); $('#gMute').textContent = S.game.muted ? '🔇' : '🔊'; }
function closeGame(){ Game.stop(); $('#gov').classList.add('hidden'); document.body.classList.remove('noscroll'); if (TAB==='game') renderGame(); else renderApp(); }
function openGame(mode, idx){
  const L = GT[S.game.lang]; showOverlay(); Game.run(mode, idx); Game.pause();
  let title, story;
  if (mode==='level'){ title = L.level+' '+(idx+1)+': '+L.levels[idx].name; story = esc(L.levels[idx].story); if (!S.game.seenIntro){ story = esc(L.intro)+'<br><br>'+story; S.game.seenIntro=true; save(); } }
  else { title = '❄️ '+MG[S.game.lang].jump; story = S.game.lang==='de'?'Ein kurzer Winterlauf durch verschneite Weinberge – sammle die Schneeflocken!':'A short winter run through snowy vineyards – collect the snowflakes!'; }
  gPanel(`<div class="kicker">${esc(L.story)}</div><h3>${esc(title)}</h3><p>${story}</p><p class="small muted">${esc(L.controls)}</p><button class="btn" onclick="gHide(); Game.resume()">${esc(L.play)}</button>`);
}
function openSpecial(kind){
  const L = GT[S.game.lang]; const open = isCreator() || todayS() >= ADVENT_YEAR+(kind==='xmas'?'-12-24':'-12-31');
  if (!open) return toastMsg('🔒 '+L.specialLocked+' '+(kind==='xmas'?'24.12.':'31.12.')+ADVENT_YEAR);
  showOverlay(); Game.run(kind); Game.pause();
  gPanel(`<div class="kicker">${kind==='xmas'?'🎄':'🎆'} Special</div><h3>${esc(kind==='xmas'?L.xmas:L.nye)}</h3><p>${esc(kind==='xmas'?L.xmasStory:L.nyeStory)}</p><button class="btn" onclick="gHide(); Game.resume()">${esc(L.play)}</button>`);
}
function openBoss(){
  const L = GT[S.game.lang], gs=S.game;
  if (!bossOpen()) return toastMsg('🔒 '+L.bossLocked+' '+niceD(UNLOCK_ALL_DATE));
  const missing = GEAR.map((g,i)=>({g,i})).filter(x=>!gs.gear[x.g.id]);
  if (missing.length && !isCreator()){ sheet(`<h3>🐷 ${esc(L.boss)}</h3><p>${esc(L.needAll)}</p>${missing.map(x=>`<p>${x.g.icon} ${esc(x.g[gs.lang])} → ${esc(L.level)} ${x.i+1}: ${esc(L.levels[x.i].name)}</p>`).join('')}<button class="btn" onclick="closeSheet()">${esc(L.close)}</button>`); return; }
  showOverlay(); Game.run('boss'); Game.pause();
  gPanel(`<div class="kicker">${esc(L.boss)}</div><h3>🐷 ${esc(L.boss)}</h3><p>${esc(L.bossStory)}</p><p><b>${esc(L.bossGear)}</b></p><ul class="gearlist">${GEAR.map(g=>`<li>${g.icon} <b>${esc(g[gs.lang])}:</b> ${esc(gs.lang==='de'?g.bossDe:g.bossEn)}</li>`).join('')}</ul>${missing.length?`<p class="devnote">🛠 Ersteller-Test: fehlende Ausrüstung wird ignoriert.</p>`:''}<button class="btn" onclick="gHide(); Game.resume()">${esc(L.play)}</button>`);
}
Game.onEnd = (mode, idx, r) => {
  const L = GT[S.game.lang], gs = S.game, lang = gs.lang; let html='';
  const fact = FUN_FACTS[((idx||0)*5 + (mode==='boss'?3:mode==='xmas'?7:mode==='nye'?11:0)) % FUN_FACTS.length];
  const factBox = `<div class="ffbox"><div class="kicker">${esc(L.funfact)}</div><p>${esc(fact[lang])}</p><span class="src">${esc(fact.src)}</span></div>`;
  const again = `<button class="btn ghost" onclick="${mode==='level'?`openGame('level',${idx})`:mode==='boss'?'openBoss()':mode==='mini'?`openGame('mini',${idx})`:`openSpecial('${mode}')`}">${esc(L.again)}</button>`;
  const row = `<div class="row">${again}<button class="btn" onclick="closeGame()">${esc(L.close)}</button></div>`;
  if (!r.win){ html = `<h3>${r.why==='time'?'🎆 '+esc(L.nyeLose):'💔 '+esc(L.gameOver)}</h3>${factBox}${row}`; }
  else if (mode==='level'){
    gs.done[idx]=true; gs.best[idx]=Math.max(gs.best[idx]||0, r.coins); let itemTxt=''; const g = GEAR[idx];
    if (r.item){ gs.gear[g.id]=true; itemTxt = `<div class="itembox"><span>${g.icon}</span><div><b>${esc(L.found)}: ${esc(g[lang])}</b><p class="small">${esc(lang==='de'?g.tipDe:g.tipEn)}</p></div></div>`; }
    else if (!gs.gear[g.id]) itemTxt = `<p>❔ ${esc(L.missing)}: ${g.icon} ${esc(g[lang])}</p>`;
    save(); html = `<h3>🏁 ${esc(L.complete)}</h3><p>${r.coins}/${r.total} ${esc(L.pretzels)}</p>${itemTxt}${factBox}${row}`;
  } else if (mode==='boss'){ gs.bossWon=true; save(); html = `<h3>🏆 ${esc(L.bossWin)}</h3><div class="ffbox">${RACE_TIPS.slice(1,5).map(t=>`<p class="small">• ${esc(lang==='en'&&t.en?t.en:t.t)} <span class="src">(${esc(t.src)})</span></p>`).join('')}</div>${row}`; }
  else if (mode==='xmas'){ gs.xmasWon=true; save(); html = `<h3>🎄 ${esc(L.xmasWin)}</h3><p>${r.coins}/${r.total} ${esc(L.gifts)}</p>${factBox}${row}`; }
  else if (mode==='nye'){ gs.nyeWon=true; save(); html = `<h3>🎆 ${esc(L.nyeWin)}</h3><p>${r.coins}/${r.total} ${esc(L.sparklers)}</p>${factBox}${row}`; }
  else { html = `<h3>❄️ ${esc(MG[lang].done)}</h3><p>${r.coins}/${r.total} ❄️</p>${factBox}${row}`; }
  gPanel(html);
};

/* ---------- Rangliste ---------- */
let RANK_BY = 'km';
async function renderRank(){
  $('#view').innerHTML = `<h2>🏆 Rangliste</h2><div class="seg"><button class="${RANK_BY==='km'?'on':''}" onclick="RANK_BY='km'; renderRank()">Kilometer</button><button class="${RANK_BY==='items'?'on':''}" onclick="RANK_BY='items'; renderRank()">Gegenstände</button></div><div id="rk" class="card"><p class="muted">Lade …</p></div>`;
  let rows = await Store.scores(); if (TAB!=='rank') return;
  rows = rows.map(r=>({ name:r.name, km:+r.km||0, items:+r.items||0, coins:+r.coins||0 }));
  rows.sort((a,b)=> RANK_BY==='km' ? (b.km-a.km || b.items-a.items) : (b.items-a.items || b.coins-a.coins || b.km-a.km));
  const me = nameKey(Store.user.name);
  $('#rk').innerHTML = rows.length ? `<ol class="rank">${rows.map((r,i)=>`<li class="${nameKey(r.name)===me?'me':''}"><span class="pos">${['🥇','🥈','🥉'][i]||(i+1)+'.'}</span><span class="nm">${esc(r.name)}</span><span class="val">${RANK_BY==='km' ? String(Math.round(r.km*10)/10).replace('.',',')+' km' : r.items+'/8 '+GEAR.filter((g,j)=>j<r.items).map(g=>g.icon).join('')}</span></li>`).join('')}</ol>`
    : `<p class="muted">Noch keine Einträge.</p>`;
  if (RANK_BY==='items') $('#rk').insertAdjacentHTML('beforeend','<p class="small muted">Gezählt wird die Laufausrüstung, die im Spiel gesammelt wurde. Bei Gleichstand entscheiden die Brezeln.</p>');
  if (isCreator()) $('#rk').insertAdjacentHTML('beforeend',`<p class="devnote">🛠 Ersteller-Konten erscheinen nicht in der Rangliste.${Store.mode==='local'?' Lokaler Modus: Es werden nur Konten dieses Geräts angezeigt, bis der Server eingerichtet ist.':''}</p>`);
}

/* ---------- Wissen ---------- */
function renderKnow(){
  const P = myPaces(); const used = ['RDL','R-EDL','EDL','EDL+ST','EDL/WK','IDL','I-TDL','TDL','TDL/EDL','FS','WHL','WHL/WKT','KT','-'];
  $('#view').innerHTML = `<h2>Wissen & Rechner</h2>
    <nav class="chips"><button data-t="k-kraft">💪 Krafttraining</button><button data-t="k-formen">🏃 Trainingsformen</button><button data-t="k-mm">✨ Magic Mile</button><button data-t="k-rech">⏱️ Rechner</button><button data-t="k-race">🏁 Renntag</button><button data-t="k-fakt">📚 Fakten</button></nav>
    <section class="card" id="k-kraft"><h3>💪 Krafttraining – Übungsvorschläge</h3>${strengthHTML()}</section>
    <section class="card" id="k-formen"><h3>🏃 Die Laufarten</h3><p class="muted small">In deinem Plan gibt es drei Laufarten – dazu Krafttraining und Ruhetage. Mit Pulsuhr orientierst du dich an der Herzfrequenz, ohne Pulsmessung an deinem Gefühl beim Sprechen.</p>
      ${['G','S','I'].map(k=>`<details class="gl"><summary><b>${CATS[k].icon} ${esc(CATS[k].name)}</b></summary>${catBody(k)}</details>`).join('')}
      ${['KT','-'].map(k=>{ const t=TYPES[k]; return `<details class="gl"><summary><b>${k==='KT'?'💪':'😴'} ${esc(t.name)}</b></summary><p>${esc(t.what)}</p><p><b>Wofür?</b> ${esc(t.why)}</p>${k==='KT'?'<p class="small">Übungen: siehe „Krafttraining“ oben.</p>':''}<span class="src">${esc(t.src)}</span></details>`; }).join('')}
      <div class="ffbox light"><b>Ohne Pulsuhr – die Sprech-Regel</b><p class="small">🟢 Gemütlich: Du kannst noch gut sprechen. 🟠 Schnell: Bei zügigen Einheiten kannst du gerade noch sprechen, bei schnellen läufst du die ganze Strecke mit maximaler, aber konstanter Geschwindigkeit. 🔴 Intervalle: schnelle Abschnitte wie der schnelle Dauerlauf, in den Pausen wieder gut sprechen können.</p><span class="src">Beck, 2024, S. 162</span></div>
      <p class="small muted">${esc(HF_NOTE)}</p></section>
    <section class="card" id="k-mm"><h3>✨ Magic Mile</h3>
      <p>Die Magic Mile ist ein kurzer Leistungstest aus den Halbmarathon-Programmen von Jeff und Barbara Galloway. Du läufst eine Meile – das sind 1,609 km, auf der Laufbahn etwa vier Runden – auf Zeit. In Galloways Plänen taucht der Test regelmäßig donnerstags auf, zum Beispiel als „1 Meile Magic Mile + 3 Meilen“.</p>
      <p><b>So rechnest du:</b> Magic-Mile-Zeit × 1,2 = das Tempo pro Meile, das du aktuell im Halbmarathon laufen könntest. Das gilt bei höchstens 14 °C und wenn du die langen Läufe und Tempoeinheiten deines Plans absolviert hast.</p>
      <p><b>Zielwahl:</b> Nach dem ersten Test darfst du dir ein Ziel setzen, das bis zu 15 s/km (20 s pro Meile) schneller ist als die Prognose – oder jedes langsamere.</p>
      <p><b>Lange Läufe:</b> Prognose-Tempo + 3 Minuten pro Meile – so bleiben sie wirklich locker. Bei Wärme über 14 °C zusätzlich pro 2 °C etwa 20 s/km langsamer.</p>
      <span class="src">Galloway & Galloway, 2019, S. 49 ff.</span>
      <label>Deine Zeit für 1 Meile (mm:ss)<input id="mm" placeholder="z. B. 9:30"></label><div id="mmr"></div></section>
    <section class="card" id="k-rech"><h3>⏱️ Tempo-Rechner</h3><p class="small muted">Trainingstempi aus einer 10-km-Zeit (Aderhold, 2018, S. 89) und Halbmarathon-Prognose (Beck, 2024).</p>
      <label>10-km-Zeit (mm:ss)<input id="tk" value="${S.profile.tenK?fmtTime(S.profile.tenK):''}" placeholder="z. B. 58:30"></label><div id="tkr"></div></section>
    <section class="card"><h3>🌡️ Wärme-Anpassung</h3><p class="small muted">Ab 14 °C pro 2 °C etwa 20 s/km langsamer (Galloway & Galloway, 2019, S. 49).</p>
      <label>Temperatur (°C)<input id="tc" type="number" placeholder="z. B. 20"></label><div id="tcr"></div></section>
    <section class="card" id="k-race"><h3>🏁 Renntag & Tapering</h3>${RACE_TIPS.map(t=>`<p>• ${esc(t.t)} <span class="src">(${esc(t.src)})</span></p>`).join('')}</section>
    <h2 class="mt" id="k-fakt">Fakten nach Rubriken</h2>
    ${FACT_CATS.map(c=>`<details class="factcat"><summary><span class="fci">${c.icon}</span><span><b>${esc(c.name)}</b><small>${esc(c.intro)}</small></span></summary>
      ${FACTS.filter(f=>f.cat===c.id).map(f=>`<div class="factitem"><h4>${esc(f.title)}</h4><p>${esc(f.de)}</p><span class="src">${esc(f.src)}</span></div>`).join('')}</details>`).join('')}`;
  bindStrength($('#view')); document.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.t).scrollIntoView({behavior:'smooth', block:'start'}));
  const calc = () => { const t = parseTime($('#tk').value); if (!t){ $('#tkr').innerHTML=''; return; } const p=paces(t);
    $('#tkr').innerHTML = `<table class="tbl">${[['🟠 Schneller Dauerlauf – schnell',p.TDL],['🟠 Schneller Dauerlauf – zügig',p.IDL],['🟢 Gemütlicher Dauerlauf',p.EDL],['🟢 Gemütlich – sehr ruhig',p.RDL],['🔴 Intervalle à 1 km',p.WHL1],['🔴 Intervalle à 2 km',p.WHL2],['🔴 Intervalle à 3 km',p.WHL3]].map(r=>`<tr><td>${r[0]}</td><td><b>${fmtPace(r[1])}</b> min/km</td></tr>`).join('')}
      <tr class="hl"><td>Halbmarathon-Prognose (× 2,2234)</td><td><b>${fmtTime(p.HMtime)}</b> h · ${fmtPace(p.HM)} min/km</td></tr></table>
      ${t!==S.profile.tenK?'<button class="btn sm ghost" id="tks">Für meine Tempoangaben übernehmen</button>':''}`;
    const b=$('#tks'); if (b) b.onclick = () => { S.profile.tenK=t; save(); toastMsg('Übernommen – dein Plan zeigt jetzt diese Tempi.'); calc(); }; };
  $('#tk').oninput = calc; calc();
  $('#mm').oninput = () => { const t=parseTime($('#mm').value); if(!t){ $('#mmr').innerHTML=''; return; } const hm=t*1.2, lr=hm+180;
    $('#mmr').innerHTML = `<table class="tbl"><tr><td>Halbmarathon-Tempo (aktuell)</td><td><b>${fmtPace(hm/1.609)}</b> min/km · ${fmtPace(hm)} /Meile</td></tr><tr><td>≈ Halbmarathon-Zeit</td><td><b>${fmtTime(hm*13.109)}</b></td></tr><tr><td>Schnellstes sinnvolles Ziel</td><td><b>${fmtPace(hm/1.609-15)}</b> min/km</td></tr><tr><td>Lange Läufe</td><td><b>${fmtPace(lr/1.609)}</b> min/km · ${fmtPace(lr)} /Meile</td></tr></table>`; };
  $('#tc').oninput = () => { const c=+$('#tc').value; if($('#tc').value===''){ $('#tcr').innerHTML=''; return; } const add = c>14 ? Math.ceil((c-14)/2)*20 : 0;
    $('#tcr').innerHTML = `<p>${add?`Etwa <b>${add} s/km</b> langsamer laufen.`:'Keine Anpassung nötig.'}${add && P?` Dein Halbmarathon-Tempo: ${fmtPace(P.HM)} → <b>${fmtPace(P.HM+add)}</b> min/km.`:''}</p>`; };
}

/* ---------- Literatur ---------- */

  $('#view').innerHTML = `<h2>Verwendete Literatur</h2><p class="muted">Alle Trainingsinhalte, Tipps und Fakten dieser App stammen aus diesen Werken. Zitierweise: APA, 7. Auflage.</p>
    <section class="card lit">${LITERATURE.map(l=>`<p class="apa">${l.apa}</p><p class="small muted">Verwendet für: ${esc(l.note)}</p>`).join('<hr>')}</section>
    <p class="small muted">Die App ersetzt keine ärztliche Beratung. Aderhold (2018) empfiehlt eine jährliche sportärztliche Vorsorgeuntersuchung.</p>
    ${isCreator()?`<section class="card note devnote"><b>🛠 Nur für dich sichtbar</b><p class="small">Die Inhalte wurden aus Scans übernommen – Seitenzahlen bitte am Original prüfen. Abkürzungen R-EDL, E-RDL, I-TDL und „8/2 km“ sind gedeutet. Sekundärverweise im Buch (Steffny, 2017; Wenzel, 1991) sind nicht gelistet, da nur die vorliegenden Bücher genutzt wurden.</p></section>`:''}`;
}

/* ---------- Start ---------- */
document.addEventListener('DOMContentLoaded', async () => {
  Game.init(); document.documentElement.style.setProperty('--title', `url(${TITLE_IMG})`);
  try { document.documentElement.style.setProperty('--skyline', `url(${Game.skylineURL('#8e2433')})`); } catch(e){}
  $('#gclose').onclick = closeGame;
  $('#sheet').addEventListener('click', e => { if (e.target.id==='sheet') closeSheet(); });
  $('#app').innerHTML = '<div class="loading">…</div>';
  const u = await Store.init();
  if (u) await afterLogin(); else renderLogin('login');
});
